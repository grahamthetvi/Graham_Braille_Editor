name: Build Bridge
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Resolve version
      id: ver
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          R='${{ github.ref_name }}'
          echo "semver=${R#v}" >> "$GITHUB_OUTPUT"
        else
          echo "semver=dev" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.7'
        cache-dependency-path: bridge/go.sum

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev rpm

    - name: Build Bridge (Linux amd64)
      if: runner.os == 'Linux'
      env:
        VERSION: ${{ steps.ver.outputs.semver }}
      run: |
        cd bridge
        go build -ldflags="-X main.Version=${VERSION} -X main.BuildNumber=${{ github.run_number }}" -o graham-bridge-linux-amd64 .
        cp ../install.sh ./install.sh
        chmod +x install.sh
        printf '%s\n' \
          'Graham Bridge — Linux amd64' \
          '' \
          'Recommended (no root):' \
          '  ./install.sh' \
          '  # installs to ~/.local/bin and ~/.local/share/applications' \
          '' \
          'System-wide:' \
          '  ./install.sh --system' \
          '' \
          'Updates: tray menu → Check for updates / Update available.' \
          'ChromeOS: use WebUSB in the editor — Bridge is not needed.' \
          > INSTALL.txt
        zip -r graham-bridge-linux.zip graham-bridge-linux-amd64 graham-bridge.desktop tray_icon.png install.sh INSTALL.txt
        chmod +x build-rpm.sh
        VERSION="${VERSION}" ./build-rpm.sh
        cp rpmbuild/RPMS/x86_64/*.rpm ./
        ls -la ./*.rpm ./*.zip

    - name: Setup MSYS2 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: gcc base-devel

    - name: Build Bridge (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CGO_ENABLED: 1
        CC: C:\msys64\ucrt64\bin\gcc.exe
        VERSION: ${{ steps.ver.outputs.semver }}
      run: |
        cd bridge
        & .\packaging\embed-winres.ps1 -Version $env:VERSION -BuildNumber "${{ github.run_number }}"
        go build -ldflags="-H windowsgui -X main.Version=$env:VERSION -X main.BuildNumber=${{ github.run_number }}" -o graham-bridge-windows.exe .

    - name: Resolve Windows code-signing mode
      id: codesign
      if: runner.os == 'Windows'
      shell: bash
      env:
        AZURE_ACCOUNT: ${{ vars.AZURE_CODESIGN_ACCOUNT }}
        PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      run: |
        if [ -n "$AZURE_ACCOUNT" ]; then
          echo "mode=azure" >> "$GITHUB_OUTPUT"
          echo "Windows Authenticode: Azure Artifact Signing ($AZURE_ACCOUNT)"
        elif [ -n "$PFX" ]; then
          echo "mode=pfx" >> "$GITHUB_OUTPUT"
          echo "Windows Authenticode: PFX certificate"
        else
          echo "mode=none" >> "$GITHUB_OUTPUT"
          echo "Windows Authenticode: skipped (set AZURE_CODESIGN_ACCOUNT or WINDOWS_CERT_PFX_BASE64)."
          echo "Unsigned builds show SmartScreen 'Unknown publisher'. See README."
        fi

    - name: Sign graham-bridge-windows.exe (Azure Artifact Signing)
      if: runner.os == 'Windows' && steps.codesign.outputs.mode == 'azure'
      uses: azure/artifact-signing-action@v2
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_CODESIGN_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_CODESIGN_PROFILE }}
        files: ${{ github.workspace }}\bridge\graham-bridge-windows.exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        description: Graham Bridge
        description-url: https://grahambrailleeditor.com/

    - name: Sign graham-bridge-windows.exe (PFX)
      if: runner.os == 'Windows' && steps.codesign.outputs.mode == 'pfx'
      shell: pwsh
      env:
        WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      run: |
        & .\bridge\packaging\sign-windows.ps1 -Files .\bridge\graham-bridge-windows.exe

    - name: Zip Windows exe
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path .\bridge\graham-bridge-windows.exe -DestinationPath .\bridge\graham-bridge-windows.zip

    - name: Install Inno Setup
      if: runner.os == 'Windows'
      run: choco install innosetup -y --no-progress

    - name: Build Windows setup.exe
      if: runner.os == 'Windows'
      env:
        VERSION: ${{ steps.ver.outputs.semver }}
      shell: pwsh
      run: |
        cd bridge
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" packaging\graham-bridge.iss
        Move-Item -Force packaging\Output\graham-bridge-windows-setup.exe .\graham-bridge-windows-setup.exe
        Get-ChildItem graham-bridge-windows*.exe, graham-bridge-windows.zip

    - name: Sign graham-bridge-windows-setup.exe (Azure Artifact Signing)
      if: runner.os == 'Windows' && steps.codesign.outputs.mode == 'azure'
      uses: azure/artifact-signing-action@v2
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_CODESIGN_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_CODESIGN_PROFILE }}
        files: ${{ github.workspace }}\bridge\graham-bridge-windows-setup.exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        description: Graham Bridge Setup
        description-url: https://grahambrailleeditor.com/

    - name: Sign graham-bridge-windows-setup.exe (PFX)
      if: runner.os == 'Windows' && steps.codesign.outputs.mode == 'pfx'
      shell: pwsh
      env:
        WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      run: |
        & .\bridge\packaging\sign-windows.ps1 -Files .\bridge\graham-bridge-windows-setup.exe

    - name: Build Bridge (macOS)
      if: runner.os == 'macOS'
      run: |
        cd bridge
        chmod +x build-macos.sh
        ./build-macos.sh
        zip -r graham-bridge-macos.zip "Graham Bridge.app"
      env:
        CGO_ENABLED: 1
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        VERSION: ${{ steps.ver.outputs.semver }}

    - name: Upload Artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: bridge-linux
        path: |
          bridge/graham-bridge-linux.zip
          bridge/*.rpm

    - name: Upload Artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: bridge-windows
        path: |
          bridge/graham-bridge-windows.zip
          bridge/graham-bridge-windows-setup.exe

    - name: Upload Artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: bridge-macos
        path: bridge/graham-bridge-macos.zip

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4

    - name: Resolve version
      id: ver
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          R='${{ github.ref_name }}'
          echo "semver=${R#v}" >> "$GITHUB_OUTPUT"
        else
          echo "semver=dev" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.7'
        cache-dependency-path: bridge/go.sum

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

    - name: Build Bridge (Linux arm64)
      env:
        VERSION: ${{ steps.ver.outputs.semver }}
      run: |
        cd bridge
        go build -ldflags="-X main.Version=${VERSION} -X main.BuildNumber=${{ github.run_number }}" -o graham-bridge-linux-arm64 .
        cp ../install.sh ./install.sh
        chmod +x install.sh
        printf '%s\n' \
          'Graham Bridge — Linux arm64 / Raspberry Pi' \
          '' \
          'Recommended (no root):' \
          '  ./install.sh' \
          '  # installs to ~/.local/bin and ~/.local/share/applications' \
          '' \
          'System-wide:' \
          '  ./install.sh --system' \
          '' \
          'Updates: tray menu → Check for updates / Update available.' \
          'Requires Raspberry Pi OS Desktop (systray).' \
          > INSTALL.txt
        zip -r graham-bridge-linux-arm64.zip graham-bridge-linux-arm64 graham-bridge.desktop tray_icon.png install.sh INSTALL.txt
        ls -la ./*.zip

    - name: Upload Artifact (Linux arm64)
      uses: actions/upload-artifact@v4
      with:
        name: bridge-linux-arm64
        path: bridge/graham-bridge-linux-arm64.zip

  release:
    needs: [build, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-linux
          path: out

      - name: Download Linux arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-linux-arm64
          path: out

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-windows
          path: out

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-macos
          path: out

      - name: Version for RPM filename
        id: meta
        run: |
          R='${{ github.ref_name }}'
          echo "semver=${R#v}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: Graham Bridge ${{ github.ref_name }}
          body: |
            ## Graham Bridge ${{ github.ref_name }}

            A lightweight system-tray app that bridges the Graham Braille Editor web app to your local braille embosser.

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows (recommended) | `graham-bridge-windows-setup.exe` — no admin; installs under LocalAppData and can start at login |
            | Windows (ZIP) | `graham-bridge-windows.zip` → run `graham-bridge-windows.exe` |
            | Linux amd64 (ZIP) | `graham-bridge-linux.zip` → `./install.sh` (user install) or `./install.sh --system` |
            | Linux arm64 / Raspberry Pi (ZIP) | `graham-bridge-linux-arm64.zip` → same install script |
            | Linux (Fedora RPM) | `graham-bridge-${{ steps.meta.outputs.semver }}-linux-fedora.x86_64.rpm` → `sudo dnf install ./…rpm` |
            | macOS | `graham-bridge-macos.zip` → open `Graham Bridge.app` |

            ### Updates
            Tray menu → **Check for updates** / **Update available — install now** downloads the matching release asset, replaces the install, and restarts Bridge.

            ### What's New
            - **Share mode:** Pair Bridges on the LAN with a share code. Share host can be a dedicated Raspberry Pi **or** any Windows/macOS/Linux PC already connected to an embosser; teacher PCs still use a local Bridge on `127.0.0.1:8080` that relays to the host on TCP 8081
            - **Windows share hosts:** allow inbound TCP 8081 in Windows Defender Firewall (or ask IT) if pairing fails
            - **Auto-update** on Windows and Linux (tray-driven download + replace)
            - **linux-arm64** build for Raspberry Pi / aarch64
            - **RPM:** Fedora/RHEL-family `dnf` install; RPM package name remains `graham-bridge`
            - Debug dashboard at `http://localhost:8080/debug`
            - Settings at `http://localhost:8080/settings` — Share mode and Connect to a shared Bridge
            - ChromeOS: use WebUSB in the editor — Bridge is not needed
          files: out/*
